[theme]
base = "light"
primaryColor = "#7c5cff"
backgroundColor = "#fbfaff"
secondaryBackgroundColor = "#f1edff"
textColor = "#1f2340"
font = "sans serif"
baseRadius = "large"
borderColor = "#e2dcff"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
# Don't scan files for changes. Saves CPU (PyTorch has thousands of files).
# After editing code, stop the app (Ctrl+C) and run it again to see changes.
fileWatcherType = "none"
